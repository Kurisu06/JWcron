<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cronómetro</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
  height: 100%;
}

/* BOTÓN FULLSCREEN */
.fullscreen-btn {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 1000;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(6px);
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}

.fullscreen-btn:hover {
  background: rgba(255,255,255,0.2);
}

/* FLECHA SALIR */
.exit-fullscreen {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 2000;
  font-size: 28px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(6px);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}

.exit-fullscreen:hover {
  background: rgba(0,0,0,0.5);
}

.container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 22px;
  padding: 20px;
  box-sizing: border-box;
}

.timer-box {
  width: min(90vw, 600px);
  height: clamp(120px, 20vw, 200px);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(60px, 10vw, 140px);
  font-weight: 600;
  border-radius: 20px;
  background: #3f3f46;
  letter-spacing: 6px;
  transition: all 0.3s ease;
}

.controls, .settings {
  display: flex;
}

.settings {
  flex-direction: column;
  gap: 16px;
  align-items: center;
  width: 100%;
  max-width: 380px;
}

.limit-control {
  display: flex;
  align-items: center;
  gap: 10px;
}

.color-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.color-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  padding: 8px 12px;
  border-radius: 12px;
}

button, input {
  background: #1e293b;
  border: none;
  color: white;
  padding: 14px 20px;
  border-radius: 10px;
  font-size: 16px;
}

button { cursor: pointer; }
button:hover { background: #334155; }

input[type="color"] {
  width: 42px;
  height: 32px;
  border-radius: 6px;
  padding: 0;
}

/* 🔥 MODO PROYECTOR */
.fullscreen-mode .controls,
.fullscreen-mode .settings,
.fullscreen-mode .fullscreen-btn {
  display: none !important;
}

.fullscreen-mode .timer-box {
  width: 95vw;
  height: 95vh;
  font-size: 20vw;
  border-radius: 0;
}
</style>
</head>

<body>

<button class="fullscreen-btn" id="fullscreenBtn">Pantalla completa</button>
<div class="exit-fullscreen" id="exitFullscreen">←</div>

<div class="container">
  <div class="timer-box" id="timer">00:00</div>

  <div class="controls">
    <button id="startPauseBtn">Inicio</button>
    <button id="resetBtn">Reiniciar</button>
    <button id="stopBtn">Stop</button>
  </div>

  <div class="settings">
    <div class="limit-control">
      <span>Tiempo límite (min)</span>
      <input type="number" id="limitInput" value="5" min="1" style="width:70px;">
    </div>

    <div class="color-controls">
      <div class="color-item">
        <span>Color en pausa</span>
        <input type="color" id="pauseColor" value="#3f3f46">
      </div>
      <div class="color-item">
        <span>Color en movimiento</span>
        <input type="color" id="runColor" value="#16a34a">
      </div>
      <div class="color-item">
        <span>Color advertencia</span>
        <input type="color" id="warningColor" value="#f59e0b">
      </div>
      <div class="color-item">
        <span>Tiempo excedido</span>
        <input type="color" id="overColor" value="#dc2626">
      </div>
    </div>
  </div>
</div>

<script>
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitFullscreen = document.getElementById("exitFullscreen");

function enterFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) elem.requestFullscreen();
  else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
  else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
}

function exitFull() {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  else if (document.msExitFullscreen) document.msExitFullscreen();
}

fullscreenBtn.onclick = enterFullscreen;
exitFullscreen.onclick = exitFull;

document.addEventListener("fullscreenchange", () => {
  const isFull = document.fullscreenElement;
  document.body.classList.toggle("fullscreen-mode", isFull);
  exitFullscreen.style.display = isFull ? "flex" : "none";
});
</script>

</body>
</html>
