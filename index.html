<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cronómetro</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
  height: 100%;
}
.container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 22px;
  padding: 20px;
  box-sizing: border-box;
}
.timer-box {
  width: min(90vw, 600px);
  height: clamp(120px, 20vw, 200px);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(60px, 10vw, 140px);
  font-weight: 600;
  border-radius: 20px;
  background: #3f3f46;
  letter-spacing: 6px;
  transition: all 0.3s ease;
}
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
button, input {
  background: #1e293b;
  border: none;
  color: white;
  padding: 14px 20px;
  border-radius: 10px;
  font-size: 16px;
}
button { cursor: pointer; }
button:hover { background: #334155; }

.settings {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  width: 100%;
  max-width: 380px;
}
.limit-control {
  display: flex;
  align-items: center;
  gap: 10px;
}
.color-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}
.color-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  padding: 8px 12px;
  border-radius: 12px;
}
input[type="color"] {
  width: 42px;
  height: 32px;
  border: none;
  border-radius: 6px;
  padding: 0;
}

/* ===== MODO PROYECCIÓN ===== */
.projection-mode body,
.projection-mode html {
  margin: 0;
  padding: 0;
}
.projection-mode .container {
  min-height: 100vh;
  justify-content: center;
  align-items: center;
}
.projection-mode .timer-box {
  width: 100vw !important;
  height: 100vh !important;
  font-size: 18vw !important;
  border-radius: 0 !important;
}
.projection-mode .controls,
.projection-mode .settings {
  display: none !important;
}

/* ===== FLECHA SALIR PROYECCIÓN ===== */
.exit-projection {
  display: none;
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 36px;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  z-index: 9999;
  user-select: none;
  transition: color 0.2s;
}
.exit-projection:hover {
  color: rgba(255,255,255,0.9);
}
.projection-mode .exit-projection {
  display: block;
}
</style>
</head>

<body>
<div class="container">
  <div class="timer-box" id="timer">00:00</div>

  <div class="controls">
    <button id="startPauseBtn">Inicio</button>
    <button id="resetBtn">Reiniciar</button>
    <button id="stopBtn">Stop</button>
    <button id="fullscreenBtn">Pantalla completa</button>
  </div>

  <div class="settings">
    <div class="limit-control">
      <span>Tiempo límite (min)</span>
      <input type="number" id="limitInput" value="5" min="1" style="width:70px;">
    </div>

    <div class="color-controls">
      <div class="color-item">
        <span>Color en pausa</span>
        <input type="color" id="pauseColor" value="#3f3f46">
      </div>
      <div class="color-item">
        <span>Color en movimiento</span>
        <input type="color" id="runColor" value="#16a34a">
      </div>
      <div class="color-item">
        <span>Color advertencia</span>
        <input type="color" id="warningColor" value="#f59e0b">
      </div>
      <div class="color-item">
        <span>Tiempo excedido</span>
        <input type="color" id="overColor" value="#dc2626">
      </div>
    </div>
  </div>
</div>

<!-- FLECHA SALIR PROYECCIÓN -->
<div class="exit-projection" id="exitProjection">&#8592;</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, set, onValue, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* ---------- FIREBASE ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCQiHP9BhNw1u751b2Wu_hMqu7TBVHCWsU",
  authDomain: "crono-1f6e8.firebaseapp.com",
  databaseURL: "https://crono-1f6e8-default-rtdb.firebaseio.com",
  projectId: "crono-1f6e8",
  storageBucket: "crono-1f6e8.firebasestorage.app",
  messagingSenderId: "685487663087",
  appId: "1:685487663087:web:980c13ec43d8807fcaf81a"
};
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const cronoref = ref(database, "cronometro");
const offsetRef = ref(database, ".info/serverTimeOffset");

/* ---------- VARIABLES ---------- */
let serverOffset = 0;
onValue(offsetRef, snap => { serverOffset = snap.val() || 0; });

function getServerTime(){ return Date.now() + serverOffset; }

let running = false;
let seconds = 0;
let limit = 300;
let lastUpdate = getServerTime();

const timerBox = document.getElementById("timer");
const startPauseBtn = document.getElementById("startPauseBtn");
const resetBtn = document.getElementById("resetBtn");
const stopBtn = document.getElementById("stopBtn");
const limitInput = document.getElementById("limitInput");
const pauseColor = document.getElementById("pauseColor");
const runColor = document.getElementById("runColor");
const warningColor = document.getElementById("warningColor");
const overColor = document.getElementById("overColor");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitProjection = document.getElementById("exitProjection");

/* ---------- FUNCIONES ---------- */
function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(Math.floor(sec%60)).padStart(2,'0');
  return `${m}:${s}`;
}

function updateColor(){
  const warningTime = limit - 60;
  if(!running) timerBox.style.background = pauseColor.value;
  else if(seconds >= limit) timerBox.style.background = overColor.value;
  else if(seconds >= warningTime) timerBox.style.background = warningColor.value;
  else timerBox.style.background = runColor.value;
}

function updateDisplay(){
  timerBox.textContent = formatTime(seconds);
  updateColor();
}

function updateFirebase(){
  set(cronoref,{
    seconds,
    running,
    limit: limitInput.value,
    pauseColor: pauseColor.value,
    runColor: runColor.value,
    warningColor: warningColor.value,
    overColor: overColor.value,
    lastUpdate: serverTimestamp()
  });
}

/* ---------- BOTONES ---------- */
startPauseBtn.onclick = ()=>{
  running = !running;
  startPauseBtn.textContent = running ? "Pausa":"Inicio";
  lastUpdate = getServerTime();
  updateFirebase();
};
resetBtn.onclick = ()=>{
  running = false;
  seconds = 0;
  startPauseBtn.textContent = "Inicio";
  updateFirebase();
};
stopBtn.onclick = ()=>{
  running = false;
  startPauseBtn.textContent = "Inicio";
  updateFirebase();
};

/* ---------- FIREBASE ---------- */
onValue(cronoref, snapshot=>{
  const data = snapshot.val();
  if(!data) return;
  running = data.running ?? false;
  limit = (data.limit ?? 5) * 60;
  pauseColor.value = data.pauseColor ?? "#3f3f46";
  runColor.value = data.runColor ?? "#16a34a";
  warningColor.value = data.warningColor ?? "#f59e0b";
  overColor.value = data.overColor ?? "#dc2626";
  if(running && data.lastUpdate){
    const diff = (getServerTime() - data.lastUpdate) / 1000;
    seconds = Math.max(0, data.seconds + diff);
  } else {
    seconds = Math.max(0, data.seconds ?? 0);
  }
  startPauseBtn.textContent = running ? "Pausa":"Inicio";
  lastUpdate = getServerTime();
});

/* ---------- TICK ---------- */
function tick(){
  if(running){
    const now = getServerTime();
    seconds += (now - lastUpdate)/1000;
    lastUpdate = now;
  } else {
    lastUpdate = getServerTime();
  }
  updateDisplay();
  requestAnimationFrame(tick);
}

/* ---------- PANTALLA COMPLETA ---------- */
fullscreenBtn.addEventListener("click", ()=>{
  const projectionWindow = window.open(
    "",
    "_blank",
    `width=${screen.width},height=${screen.height},top=0,left=0`
  );

  projectionWindow.document.write(`
    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="UTF-8">
      <title>Proyección</title>
      <style>
        html, body {
          margin: 0;
          padding: 0;
          background: black;
          overflow: hidden;
        }
        #timerDisplay {
          width: 100vw;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 18vw;
          font-family: 'Segoe UI', sans-serif;
          color: white;
        }
      </style>
    </head>
    <body>
      <div id="timerDisplay">00:00</div>

      <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue } 
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCQiHP9BhNw1u751b2Wu_hMqu7TBVHCWsU",
          authDomain: "crono-1f6e8.firebaseapp.com",
          databaseURL: "https://crono-1f6e8-default-rtdb.firebaseio.com",
          projectId: "crono-1f6e8",
          storageBucket: "crono-1f6e8.firebasestorage.app",
          messagingSenderId: "685487663087",
          appId: "1:685487663087:web:980c13ec43d8807fcaf81a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const cronoref = ref(db, "cronometro");

        const timerEl = document.getElementById("timerDisplay");

        function formatTime(sec){
          if(!isFinite(sec) || sec < 0) sec = 0;
          const m = String(Math.floor(sec/60)).padStart(2,'0');
          const s = String(Math.floor(sec%60)).padStart(2,'0');
          return m + ":" + s;
        }

        onValue(cronoref, (snap)=>{
          const data = snap.val();
          if(!data) return;

          const seconds = data.seconds ?? 0;
          const limit = (data.limit ?? 5) * 60;

          timerEl.textContent = formatTime(seconds);

          const warningTime = limit - 60;

          if(!data.running){
            timerEl.style.background = data.pauseColor;
          } else if(seconds >= limit){
            timerEl.style.background = data.overColor;
          } else if(seconds >= warningTime){
            timerEl.style.background = data.warningColor;
          } else {
            timerEl.style.background = data.runColor;
          }
        });

        // fullscreen SOLO con clic
        document.addEventListener("click", ()=>{
          const el = document.documentElement;
          if(el.requestFullscreen) el.requestFullscreen();
        });
      <\/script>
    </body>
    </html>
  `);
});

/* ---------- FLECHA SALIR ---------- */
exitProjection.addEventListener("click", ()=>{
  document.body.classList.remove("projection-mode");
  if(document.exitFullscreen) document.exitFullscreen();
  else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  else if(document.msExitFullscreen) document.msExitFullscreen();
});

document.addEventListener("fullscreenchange", ()=>{
  if(!document.fullscreenElement){
    document.body.classList.remove("projection-mode");
  }
});

tick();
</script>

</body>
</html>
